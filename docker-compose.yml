services:
  postgres:
    image: postgres:16-alpine
    container_name: blik-games-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blik_games
      POSTGRES_USER: blik_games
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в переменных стека}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blik_games -d blik_games"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Задайте NEXT_PUBLIC_SITE_URL}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://blik_games:${POSTGRES_PASSWORD}@postgres:5432/blik_games

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Задайте NEXT_PUBLIC_SITE_URL}
    container_name: blik-games-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://blik_games:${POSTGRES_PASSWORD}@postgres:5432/blik_games
      UPLOADS_DIR: /app/uploads
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - default
      - nginx_default

volumes:
  pg_data:
  uploads_data:

networks:
  nginx_default:
    external: true
