services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blik_games
      POSTGRES_USER: blik_games
      POSTGRES_PASSWORD: blik_games_dev
    ports:
      - "5433:5432"
    volumes:
      - blik_pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blik_games"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  blik_pg_dev_data:
